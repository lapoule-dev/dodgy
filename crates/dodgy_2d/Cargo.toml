[package]
edition = "2021"
name = "dodgy_2d"
version = "0.6.0"

description = "An implementation of ORCA, a local collision avoidance algorithm for 2D."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/andriyDev/dodgy"

categories = ["game-development"]
keywords = ["orca", "rvo", "collision", "avoidance", "navigation"]

[dependencies]
glam = { version = "0.33", default-features = false, features = ["std"] }
libm = { version = "0.2", optional = true }

[features]
# Allows access to some of the internal data used to generate the final suggested velocity.
debug = []
# The O(n^2) reference `Simulator`. Not needed when feeding
# `Agent::compute_avoiding_velocity` with your own neighbour queries.
simulator = []
# Deterministic trigonometry through the pure-Rust `libm` crate (the same bits
# on every target). Enables `VisibilitySet`, which needs trigonometry; the
# per-agent ORCA computation never does, with or without this feature.
libm = ["dep:libm"]
